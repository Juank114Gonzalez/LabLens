name: Keep Render service alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          echo "================================"
          echo "KEEPALIVE START"
          echo "UTC: $(date -u)"
          echo "================================"

          curl \
            --fail \
            --show-error \
            --verbose \
            --max-time 60 \
            "https://lablens-qopg.onrender.com/api/keepalive"

          echo ""
          echo "================================"
          echo "KEEPALIVE SUCCESS"
          echo "UTC: $(date -u)"
          echo "================================"
