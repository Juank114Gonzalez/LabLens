name: Keep Render service alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Render..."
          date -u

          curl -v \
            --fail \
            --max-time 30 \
            "https://lablens-qopg.onrender.com/api/health"

          echo "OK: servicio respondió"